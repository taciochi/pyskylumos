# Paper artifact: the capture manifest as it stood BEFORE the image-anchored
# calibration corrected it. 16:05 was local British Summer Time recorded as if
# it were UTC. Running calibrate_sun_time.py against this file reproduces the
# one-hour correction; running it against capture.toml cannot, because that file
# already holds the corrected 15:05:05 and the search centres on it.
# Everything else is byte-identical to capture.toml.
# Capture assumptions recovered from pyskylumos_quantification.zip.
# The TIFF metadata does not contain time, location, or camera orientation; these
# values therefore remain explicit, auditable assumptions rather than metadata.

[capture]
# The source scripts' 16:05 was local British Summer Time. An independent
# raw-starburst/ephemeris search confirms the corresponding 15:05 UTC minute.
time_utc = "2025-09-22T16:05:00"
latitude_deg = 53.6358
longitude_deg = -2.52229
height_m = 1000.0

[camera]
image_height = 2048
image_width = 2448
focal_length_micrometers = 1800.0
pixel_pitch_micrometers = 3.45
lens_conjugation_type = "stereographic"
yaw_deg = 15.0
# Simulation-domain clip only. The CIE luminance formula is undefined below the
# horizon, so below-horizon rays are clipped before a model sees them. It does
# not set the comparison field; usable_image_radius_pixels does.
altitude_min_deg = 1.0
# The comparison is restricted to the lens's usable image circle. Measured from
# the capture: the azimuthal median of Snapshot_Intensity_0001.tif collapses
# from 1.41x its mid-field (r = 400-600 px) level at r = 850 px to 0.87x at
# 860 px and 0.28x at 900 px, and vendor AOP coherence falls from 0.994 at
# 850 px to 0.93 at 900 px and 0.47 at 1050 px. That is the camera rim, not
# sky. 800 px clears the onset by ~50 px, which also absorbs the ~20 px offset
# between the illuminated disc centre and the assumed optical centre. Under the
# stereographic mapping above it is altitude >= 15.1 deg, 74% of the hemisphere
# by solid angle.
usable_image_radius_pixels = 800.0
sun_exclusion_deg = 10.0
saturation_threshold = 4090.0
analyzer_tile = [[90, 45], [135, 0]]
extinction_ratio = 0.99
adc_max = 4095.0

[measurement]
input_dir = "input"
raw_file = "Snapshot_Unprocessed_0001.tif"
intensity_file = "Snapshot_Intensity_0001.tif"
dop_file = "Snapshot_DoLP_0001.tif"
aop_file = "Snapshot_Azimuth_0001.tif"
# ThorImageCam and PySkyLumos use analyzer-axis conventions that differ by 90 degrees.
vendor_aop_offset_deg = 90.0

[quantification]
# Fixed empirical daylight scale. It is applied once after every model simulation.
dop_scale = 0.7
aop_min_measured_dop = 0.05

